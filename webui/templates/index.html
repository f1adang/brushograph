<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Brušograf WebUI — turn pictures into G-code for brush plotters.">
<title>Brušograf WebUI</title>
<script>
/* Before the first paint, so a remembered theme never flashes the default one. */
try { var t = localStorage.getItem("brushograph-theme");
      if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<link rel="stylesheet" href="{{ asset('webui.css') }}">
<link rel="icon" type="image/png" href="{{ asset('favicon.png') }}">
<link rel="icon" href="{{ asset('favicon.ico') }}" sizes="any">
<link rel="apple-touch-icon" href="{{ asset('apple-touch-icon.png') }}">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="mark" aria-hidden="true"></span>
    <div class="brand-name">
      <h1>Brušograf WebUI</h1>
      <p><a href="https://wiki.sgmk-ssam.ch/wiki/Brushograph">Brušograf</a> GCode Generator - Edition
        <a href="https://wiki.sgmk-ssam.ch/wiki/Brushograph#Zweiter_Bruschologischer_Kongress,_Dresden,_7._-_12._September_2026"
           class="edition" aria-label="Zweiter Bruschologischer Kongress">𝖅𝖜𝖊𝖎𝖙𝖊𝖗 𝕭𝖗𝖚𝖘𝖈𝖍𝖔𝖑𝖔𝖌𝖎𝖘𝖈𝖍𝖊𝖗 𝕶𝖔𝖓𝖌𝖗𝖊𝖘𝖘</a></p>
    </div>
    <div class="picker">
      <label class="field">
        <span class="field-label">Machine</span>
        <span class="with-btn">
          <select name="machine-config" id="machine-config">
            <option selected disabled value="">Choose a machine…</option>
            {% for p in presets %}<option value="{{ p }}">{{ p }}</option>{% endfor %}
          </select>
          <button type="button" class="icon" id="cfg-download" title="Download this config" aria-label="Download this config">↓</button>
        </span>
      </label>
      <label class="field">
        <span class="field-label">Or use your own</span>
        <input type="file" name="machine-config-file" id="machine-config-file" accept=".conf">
      </label>
    </div>
  </div>
  <p class="error topbar-error" id="cfg-error" hidden></p>
</header>

<main class="wrap">
  <div id="options-form-container">
    <div class="placeholder">
      <svg viewBox="0 0 210 130" aria-hidden="true">
        <rect x="26" y="16" width="120" height="86" class="pl-bed"/>
        <rect x="38" y="26" width="96" height="62" class="pl-canvas"/>
        <circle cx="42" cy="112" r="8" class="pl-t1"/>
        <circle cx="66" cy="112" r="8" class="pl-t2"/>
        <circle cx="90" cy="112" r="8" class="pl-t3"/>
        <path d="M158 100 V34" class="pl-arm"/><circle cx="158" cy="30" r="5" class="pl-arm-d"/>
      </svg>
      <p>Choose a machine to begin. Its config sets the trays, the canvas and how the brush behaves.</p>
    </div>
  </div>
</main>

<footer>
  <a href="/about">How this works</a>
  <label class="theme-picker">
    <span>Theme</span>
    <select id="theme-select">
      <option value="default">Default</option>
      <option value="dark">Dark mode</option>
      <option value="coconut">Coconut mode</option>
      <option value="pinkograph">Pinkograph</option>
      <option value="uwu">UwU</option>
      <option value="kongress">𝕭𝖗𝖚𝖘𝖈𝖍𝖔𝖑𝖔𝖌𝖎𝖘𝖈𝖍𝖊𝖗 𝕶𝖔𝖓𝖌𝖗𝖊𝖘𝖘</option>
    </select>
  </label>
</footer>

<dialog id="info-dialog"></dialog>
<script>const SESSION_ID = "{{ session_id }}";</script>
<script src="{{ asset('webui.js') }}"></script>
</body>
</html>
